<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="system-ui, -apple-system, sans-serif">
  <rect width="860" height="300" rx="12" fill="#fafafa"/>
  <rect width="860" height="300" rx="12" fill="none" stroke="#e0e0e0"/>
  <text x="430" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a2e">引用是别名，指针是另一只盒子</text>

  <rect x="24" y="52" width="390" height="220" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="219" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565c0">int&amp; r = n</text>
  <rect x="70" y="110" width="160" height="70" rx="8" fill="#fff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="150" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#0d47a1">n / r</text>
  <text x="150" y="162" text-anchor="middle" font-size="12" fill="#1565c0">同一块 4 字节</text>
  <text x="70" y="210" font-size="12" fill="#37474f">必须立刻绑 · 不能空 · 不能换绑</text>
  <text x="70" y="232" font-size="12" fill="#37474f">&amp;r == &amp;n，没有「引用自己的地址」</text>

  <rect x="446" y="52" width="390" height="220" rx="10" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="641" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#e65100">int* p = &amp;n</text>
  <rect x="490" y="104" width="120" height="56" rx="8" fill="#fff" stroke="#e65100"/>
  <text x="550" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#bf360c">p</text>
  <text x="550" y="148" text-anchor="middle" font-size="11" fill="#e65100">装着 &amp;n</text>
  <rect x="680" y="104" width="120" height="56" rx="8" fill="#ffe0b2" stroke="#e65100"/>
  <text x="740" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#bf360c">n</text>
  <text x="740" y="148" text-anchor="middle" font-size="11" fill="#e65100">值 1</text>
  <path d="M 610 132 L 678 132" stroke="#e65100" stroke-width="2" marker-end="url(#arr)"/>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#e65100"/></marker></defs>
  <text x="490" y="198" font-size="12" fill="#37474f">可以空 · 可以改指向 · 可以再取地址</text>
  <text x="490" y="220" font-size="12" fill="#37474f">解引用前要问 p 是不是 nullptr</text>
  <text x="490" y="246" font-size="12" fill="#e65100">p = nullptr 合法；int&amp; e; 非法</text>
</svg>
